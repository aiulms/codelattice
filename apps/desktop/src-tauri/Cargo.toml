[package]
name = "codelattice-workbench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CodeLattice Project Understanding Workbench — Tauri 2 shell (P0)"

# 独立 manifest：不加入根 workspace，避免破坏现有 cargo test / CI 跨平台检查。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
understanding-gateway = { path = "../../../crates/understanding-gateway", features = ["http"] }
