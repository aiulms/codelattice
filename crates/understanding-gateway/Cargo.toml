[package]
name = "understanding-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CodeLattice Understanding Gateway — provider, dispatcher, validator, cache, session, worker supervisor (P0)"

[features]
default = []
# 真实 HTTP 模型 adapter（reqwest + SSE）。Tauri 壳启用；纯逻辑 crate 默认关闭，
# 保持无网络依赖的轻量测试路径。
http = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
